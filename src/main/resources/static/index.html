<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background: #f5f7fa;
        }

        input, select, button{
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }

        #range{
            margin: 25px 0;
            font-size: 18px;
            font-weight: bold;
        }

        #result{
            font-size: 20px;
            font-weight: bold;
            margin-top: 25px;
            min-height: 25px;
        }

        #attempts{
            font-size: 17px;
            font-weight: bold;
            margin-top: 15px;
        }

        #guess{
            width: 180px;
            height: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
        }

        #guessButton{
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 10px 18px;
            transition: 0.2s;
        }

        #guessButton:hover{
            transform: scale(1.05);
        }

        #guessButton:disabled{
            opacity: 0.5;
            cursor: not-allowed;
        }

        #guessButton:focus{
            outline: none;
            border-color: #777;
        }

        .game-container{
            width: 400px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .game-container h1{
            margin-bottom: 25px;
            font-size: 28px;
        }

        .difficulty-section{
            margin-bottom: 20px;
        }

        .difficulty-section button{
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 10px 18px;
            transition: 0.2s;
        }

        .difficulty-section button:hover{
            transform: scale(1.05);
        }

        .difficulty-level{
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #difficulty{
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }

        .correct{
            color: green;
            font-size: 26px;
        }

        .low{
            color: orange;
        }

        .high{
            color: orange;
        }

        .game-over{
            color: red;
            font-size: 26px;
        }

        .normal-attempts{
            color: #333;
        }

        .low-attempts{
            color: red;
        }

        @media (max-width: 500px) {
            .game-container{
                width: 85%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Number Guessing Game</h1>

        <div class="difficulty-section">
            <label class="difficulty-level">Select Difficulty</label>
            <select id="difficulty">
                <option value="1">Easy</option>
                <option value="2">Medium</option>
                <option value="3">Hard</option>
            </select>

            <button id="startButton" onclick="startGame()">Start Game</button>
        </div>

        <p id="range"></p>

        <input type="number" id="guess" placeholder="Enter your guess" disabled>
        <button id="guessButton" onclick="makeGuess()" disabled>Guess</button>

        <p id="result"></p>
        <p id="attempts"></p>
    </div>

    <script>
        function startGame(){
            let difficulty = document.getElementById("difficulty").value;

            fetch("/start?difficulty=" + difficulty)
                .then(response => response.text())
                .then(data => {
                    document.getElementById("range").innerText = data;
                    document.getElementById("startButton").innerText = "New Game";
                    document.getElementById("guessButton").disabled = false;
                    document.getElementById("guess").disabled = false;
                    document.getElementById("guess").value = "";

                    document.getElementById("result").innerText = "";
                    document.getElementById("result").className = "";

                    document.getElementById("attempts").innerText = "";
                    document.getElementById("attempts").className = "normal-attempts";
                });
        }

        function makeGuess() {
            let guess = document.getElementById("guess").value;

            fetch("/guess?guess=" + guess, {
                method: "POST"
            })
                .then(response => response.json())
                .then(data => {
                    if(!data.valid){
                        alert("Please enter a number between 1 and " + data.maxNumber);
                        return;
                    }
                    if(data.attempts == 0 && data.result != 1){
                        document.getElementById("result").innerText =
                            "Game Over! The number was " + data.number;
                        document.getElementById("result").className = "game-over";
                    }
                    else if(data.result == 1){
                        document.getElementById("result").innerText = "Correct!";
                        document.getElementById("result").className = "correct";
                    }
                    else if(data.result == 2){
                        document.getElementById("result").innerText = "Too Low!";
                        document.getElementById("result").className = "low";
                    }
                    else if(data.result == 3){
                        document.getElementById("result").innerText = "Too High!";
                        document.getElementById("result").className = "high";
                    }

                    let attemptsElement = document.getElementById("attempts");

                    attemptsElement.innerText =
                        "Attempts remaining: " + data.attempts;

                    if(data.attempts <= 2){
                        attemptsElement.className = "low-attempts";
                    }
                    else{
                        attemptsElement.className = "normal-attempts";
                    }

                    if(data.gameOver){
                        document.getElementById("guessButton").disabled = true;
                        document.getElementById("guess").disabled = true;
                    }
                });
        }
    </script>
</body>
</html>
